# see "man i3status" for documentation.

general {
	color_good = "#03C3D5"
	color_bad = "#E76941"
	color_degraded = "#FFAD55"
	interval = 1
	markup = pango
}

# order += "wireless _first_"
# order += "ethernet _first_"
order += "battery all"
order += "volume master"
# order += "disk /"
order += "cpu_usage"
# order += "memory"
order += "tztime local"

wireless _first_ {
	format_up = "W: %quality %ip"
	format_down = "W: down"
}

ethernet _first_ {
	format_up = "E: %ip (%speed)"
	format_down = "E: down"
}

battery all {
	format = "<b>%status</b> %percentage %remaining"
	status_chr =  "CHR"
	status_bat =  "BAT"
	status_full = "FUL"
	integer_battery_capacity = true
	last_full_capacity = true
	low_threshold = 40
	threshold_type = percentage
}

disk "/" {
	format = "%avail"
}

cpu_usage {
	format = "<b>CPU</b> %usage"
	max_threshold = 75
	degraded_threshold = 50
	
}

memory {
	format = "<b>RAM</b> %used"
	threshold_degraded = "4G"
}

volume master {
	format = "<b>VOL</b> %volume"
	format_muted = "<b>MUT</b> %volume"
	device = "default"
	mixer = "Master"
	mixer_idx = 0
}

tztime local {
	format = "%Y-%m-%d %H:%M"
}
