# see "man i3status" for documentation.
# also go install the nerd fonts glyphs

general {
	color_good = "#e6bccf"
	color_bad = "#e45461"
	color_degraded = "#e45461"
	interval = 1
}

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
# order += "disk /"
# order += "cpu_usage"
# order += "memory"
order += "volume master"
order += "tztime local"

wireless _first_ {
	format_up = "W: %quality %ip"
	format_down = "W: down"
}

ethernet _first_ {
	format_up = "E: %ip (%speed)"
	format_down = "E: down"
}

battery all {
	format = "%status %percentage %remaining"
	status_chr = "󰂄"
	status_bat = "󰁹"
	status_full = "󱟢"
	integer_battery_capacity = true
	last_full_capacity = true
}

disk "/" {
	format = "%avail"
}

cpu_usage {
	format = "CPU %usage"
}

memory {
	format = "%used / %available"
	threshold_degraded = "1G"
	format_degraded = "MEMORY < %available"
}

volume master {
	format = "󰎇 %volume"
	format_muted = "󰎊 muted (%volume)"
	device = "default"
	mixer = "Master"
	mixer_idx = 0
}

tztime local {
	format = "%Y-%m-%d %H:%M"
}
