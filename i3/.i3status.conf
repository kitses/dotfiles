# see "man i3status" for documentation.
# also go install the nerd fonts glyphs

general {
	color_good = "#72dec2"
	color_bad = "#ffb545"
	color_degraded = "#ffb545"
	interval = 1
	markup = pango
}

# order += "wireless _first_"
# order += "ethernet _first_"
order += "battery all"
order += "volume master"
# order += "disk /"
order += "cpu_usage"
order += "memory"
order += "tztime local"

wireless _first_ {
	format_up = "W: %quality %ip"
	format_down = "W: down"
}

ethernet _first_ {
	format_up = "E: %ip (%speed)"
	format_down = "E: down"
}

battery all {
	format = "%status %percentage %remaining"
	status_chr =  "󰂄"
	status_bat =  "󰁹"
	status_full = "󱟢"
	integer_battery_capacity = true
	last_full_capacity = true
	low_threshold = 40
	threshold_type = percentage
}

disk "/" {
	format = "%avail"
}

cpu_usage {
	format = "<span color='#72dec2'>CPU</span> %usage"
	format_above_threshold = "<span color='#ffb545'>CPU</span> %usage"
	max_threshold = 90
	degraded_threshold = 90
	
}

memory {
	format = "<span color='#72dec2'>RAM</span> %used"
	format_degraded = "<span color='#ffb545'>RAM</span> %percentage_used"
	threshold_degraded = "4G"
}

volume master {
	format = "󰎇 %volume"
	format_muted = "󰎊 %volume"
	device = "default"
	mixer = "Master"
	mixer_idx = 0
}

tztime local {
	format = "%Y-%m-%d %H:%M"
}
